# OpenOCD 0.12.0 client for this simulator's JTAG remote_bitbang.
# The shell sets RBB_PORT and GDB_PORT before sourcing this file.
# Memory access order is explicit: abstract Access Memory first, then the
# two-word program buffer (progbufsize 2, impebreak 1), then SBA (sbcs
# version 1, sbasize 64, widths 8-64).
#
# The U4 sessions instead pass a single method: `riscv set_mem_access
# progbuf` so the program buffer is the only enabled method, or
# `riscv set_mem_access sysbus` so the system bus is. A successful transfer
# in those sessions cannot have used any other path. OpenOCD's
# virtual-memory helper needs five effective buffer words, so it never runs
# on this two-word profile: OpenOCD acceptance here is physical memory, and
# MPRV/Sv39 come from the direct Hart/DMI fixture.

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $RBB_PORT

adapter speed 10000

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

gdb_port $GDB_PORT
tcl_port disabled
telnet_port disabled

riscv set_mem_access abstract progbuf sysbus

init
halt
