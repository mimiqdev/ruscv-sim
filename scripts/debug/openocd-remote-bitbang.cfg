# OpenOCD 0.12.0 client for this simulator's JTAG remote_bitbang.
# The shell sets RBB_PORT and GDB_PORT before sourcing this file.
# Memory access order is explicit: abstract Access Memory first, then the
# two-word program buffer (progbufsize 2, impebreak 1), then SBA (absent).

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $RBB_PORT

adapter speed 10000

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

gdb_port $GDB_PORT
tcl_port disabled
telnet_port disabled

riscv set_mem_access abstract progbuf sysbus

init
halt
