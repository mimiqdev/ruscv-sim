[package]
name = "ruscv-sim"
version = "0.1.0"
edition = "2021"
description = "RISC-V ISS with SystemC TLM2.0 interface"
authors = ["RISC-V Virtual Platform Team"]

[dependencies]
# 基础依赖
anyhow = "1.0"
once_cell = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4.4", features = ["derive"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 枚举转换
num_enum = "0.7"

# 代码生成
ruscv-macros = { path = "ruscv-macros" }

# FPU support
bitflags = "2"

# 测试
[dev-dependencies]
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
assert_cmd = "2.0"
tempfile = "3"

[features]
default = []
tlm = []  # SystemC TLM2.0 接口支持

[[bench]]
name = "decode_bench"
harness = false

[[bench]]
name = "execute_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "branch_predict_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "rv64d_bench"
harness = false
