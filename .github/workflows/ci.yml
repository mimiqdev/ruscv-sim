# RISC-V ISS Simulator CI
# ========================
# Pull requests run one consolidated Rust quality job. That job includes the
# release binary and the project ELF suite, so a green check is the
# repository quality gate. Coverage stays manual.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    # The same job runs for every base, including a stacked unit branch.
    # Quality and tests is a required check, including for docs-only PRs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: target/ci-cargo
  RISCV_REQUIRE_RISCV_TOOLCHAIN: "1"
  RISCV_TEST_OUTDIR: target/ci-riscv-elves

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust
        # stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      # test_add_direct assembles a bare-metal ELF during Rust tests.
      - name: Install RISC-V GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the workspace
        run: cargo check --all-features

      - name: Check A5 inventory and fail-closed accounting controls
        run: |
          python3 -m unittest discover -s scripts/a5 -p 'test_*.py'
          bash -n scripts/a5/experiment.sh

      - name: Check A10 producer pin and baseline controls
        run: python3 -m unittest discover -s tools/a10 -p 'test_*.py'

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Check documentation
        run: cargo doc --all-features --no-deps

      - name: Check guest scripts and protected output-path guards
        run: |
          bash -n scripts/riscv_elf_paths.sh scripts/compile_riscv_tests.sh
          bash -n scripts/run_elf_tests.sh scripts/test_riscv_elf_guards.sh
          bash -n scripts/riscv_elf_result.sh scripts/test_riscv_elf_result.sh
          bash scripts/test_riscv_elf_guards.sh
          bash scripts/test_riscv_elf_result.sh

      # The release binary and the project ELF suite, including every Stage 4
      # s4_* guest, run on pull requests and on main. A green Quality and
      # tests check is the Stage 4 gate, not a debug-only subset.
      - name: Build release binary
        run: cargo build --release --all-features

      - name: Smoke test release binary
        run: ./target/ci-cargo/release/ruscv-sim --version

      - name: Compile RISC-V test programs in a fresh output directory
        run: ./scripts/compile_riscv_tests.sh

      - name: Run RISC-V ELF tests through the public CLI
        env:
          RISCV_TEST_SKIP_BUILD: "1"
        run: ./scripts/run_elf_tests.sh

  # Coverage recompiles the workspace with instrumentation and is intentionally
  # manual. Run this workflow from the Actions UI when a coverage refresh is
  # useful instead of spending runner minutes on every push.
  coverage:
    name: Coverage
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust
        # stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      # test_add_direct assembles a bare-metal ELF during Rust tests.
      - name: Install RISC-V GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: >
          cargo llvm-cov --all-features --workspace
          --lcov --output-path lcov.info

      - name: Upload to Codecov
        # v5.5.5
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: true

permissions:
  contents: read
