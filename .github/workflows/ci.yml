# RISC-V ISS Simulator CI
# ========================
# Pull requests run one consolidated Rust quality job. More expensive release,
# bare-metal ELF, and coverage work runs only when it provides additional value.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Check documentation
        run: cargo doc --all-features --no-deps

      # Pull requests already exercise the debug/test build above. Build and run
      # the release binary only after code reaches main.
      - name: Build release binary
        if: github.event_name == 'push'
        run: cargo build --release --all-features

      - name: Smoke test release binary
        if: github.event_name == 'push'
        run: ./target/release/ruscv-sim --version

      # The project-authored ELF suite needs a cross assembler and linker. Keep
      # this on main pushes to avoid paying the setup cost for every PR revision.
      - name: Install RISC-V GNU toolchain
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: Compile RISC-V test programs
        if: github.event_name == 'push'
        run: ./scripts/compile_riscv_tests.sh

      - name: Run RISC-V ELF tests
        if: github.event_name == 'push'
        run: ./scripts/run_elf_tests.sh

  # Coverage recompiles the workspace with instrumentation and is intentionally
  # manual. Run this workflow from the Actions UI when a coverage refresh is
  # useful instead of spending runner minutes on every push.
  coverage:
    name: Coverage
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: true

permissions:
  contents: read
