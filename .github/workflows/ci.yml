# RISC-V ISS Simulator CI
# ========================
# Pull requests run the Rust quality job, the debug mutation controls, the
# OpenOCD debug-attach job and the SystemC transport smoke.
# The quality job includes the release binary and the project ELF suite, so a
# green `Quality and tests` check is the repository quality gate.  The mutation
# controls are one test build per control, which took over an hour next to that
# job's own steps, so they run as their own job on the same triggers with the
# same toolchain.  D14 of the Quantum contract makes `Debug mutation controls` a
# required status check beside `Quality and tests`; the `Protect main` ruleset
# lists the checks a merge must pass, and its entry for this job is the owner's
# repository-settings change.  Coverage stays manual.
# debug-attach builds the development image from the Dockerfile and runs
# scripts/debug_attach.sh --require-spike inside it.
# systemc-smoke builds the same image, whose SystemC layer pins Accellera
# SystemC 3.0.2, and runs scripts/test_systemc_smoke.sh inside it.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    # The same job runs for every base, including a stacked unit branch.
    # Quality and tests is a required check, including for docs-only PRs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: target/ci-cargo
  RISCV_REQUIRE_RISCV_TOOLCHAIN: "1"
  RISCV_TEST_OUTDIR: target/ci-riscv-elves

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust
        # stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      # test_add_direct assembles a bare-metal ELF during Rust tests.
      - name: Install RISC-V GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the workspace
        run: cargo check --all-features

      - name: Check A5 inventory and fail-closed accounting controls
        run: |
          python3 -m unittest discover -s scripts/a5 -p 'test_*.py'
          bash -n scripts/a5/experiment.sh

      - name: Check A10 producer pin and baseline controls
        run: python3 -m unittest discover -s tools/a10 -p 'test_*.py'

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Run the C ABI compile-and-link smoke
        # Builds the static library with `--features capi` and links a plain-C
        # host against it.  gcc is present on the runner; the script fails
        # rather than skipping when it is missing.
        run: ./scripts/test_capi_smoke.sh

      - name: Check documentation
        run: cargo doc --all-features --no-deps

      - name: Check guest scripts and protected output-path guards
        run: |
          bash -n scripts/riscv_elf_paths.sh
          bash -n scripts/compile_riscv_tests.sh
          bash -n scripts/run_elf_tests.sh
          bash -n scripts/test_riscv_elf_guards.sh
          bash -n scripts/riscv_elf_result.sh
          bash -n scripts/test_riscv_elf_result.sh
          bash -n scripts/debug/quantum_session_facts.sh
          bash -n scripts/test_quantum_session_facts.sh
          bash scripts/test_riscv_elf_guards.sh
          bash scripts/test_riscv_elf_result.sh
          bash scripts/test_quantum_session_facts.sh

      # The release binary and the project ELF suite, including every Stage 4
      # s4_* guest, run on pull requests and on main. A green Quality and
      # tests check is the Stage 4 gate, not a debug-only subset.
      - name: Build release binary
        run: cargo build --release --all-features

      - name: Smoke test release binary
        run: ./target/ci-cargo/release/ruscv-sim --version

      - name: Compile RISC-V test programs in a fresh output directory
        run: ./scripts/compile_riscv_tests.sh

      - name: Run RISC-V ELF tests through the public CLI
        env:
          RISCV_TEST_SKIP_BUILD: "1"
        run: ./scripts/run_elf_tests.sh

  # Every registered negative control runs one `cargo test --all-features` build
  # against a mutated copy of the committed source, so this job is CPU-bound and
  # long.  It sits beside the quality job rather than inside it because that
  # job's 90-minute budget was being spent here.  D14 makes this job a required
  # status check beside `Quality and tests`; the `Protect main` ruleset lists it
  # through the owner's repository-settings change, so this workflow claims
  # exactly what D14 and that ruleset give it.  The runner assembles bare-metal
  # ELFs, so it needs the same RISC-V toolchain the Rust tests do.
  mutation-controls:
    name: Debug mutation controls
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust
        # stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      # test_add_direct assembles a bare-metal ELF during Rust tests.
      - name: Install RISC-V GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf

      # The runner copies the committed tree to a temporary directory and runs
      # `cargo test --offline` there, so this job owes the registry its own
      # fetch: it no longer inherits one from the quality job's earlier steps.
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Run debug mutation controls
        run: python3 scripts/verify_stage6_mutations.py --source-ref HEAD

  # Stage 6 U5. Build ruscv-sim-dev:ci from this checkout's Dockerfile, using
  # the same inputs as the development-container workflow, and run the attach
  # script inside that image. Spike is the Dockerfile pin: commit 5d996117
  # plus scripts/debug/spike-5d996117-empty-progbuf.patch. --require-spike
  # makes the live comparison mandatory.
  #
  # The rolling tag ghcr.io/mimiqdev/ruscv-sim-dev:main is the image published
  # from main (6fc09766, Spike v1.1.0). This job builds the checkout
  # Dockerfile so the comparison uses the U5 pin. Pull requests do not publish.
  debug-attach:
    name: Debug attach
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check the attach script
        run: bash -n scripts/debug_attach.sh

      - name: Set up Docker Buildx
        # v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Detect runner account IDs
        id: runner-account
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build image
        # v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ruscv-sim-dev:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            DEV_UID=${{ steps.runner-account.outputs.uid }}
            DEV_GID=${{ steps.runner-account.outputs.gid }}
          cache-from: type=gha,scope=dev-container
          cache-to: type=gha,mode=max,scope=dev-container

      - name: Run the OpenOCD and GDB attach script
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            --env CARGO_BUILD_JOBS \
            --env CARGO_TERM_COLOR \
            --env CARGO_TARGET_DIR \
            ruscv-sim-dev:ci \
            bash -ceu './scripts/debug_attach.sh --require-spike'

  # Blocking TLM U6 (dev-plan D9/D11). Build the development image from this
  # checkout's Dockerfile, which builds Accellera SystemC 3.0.2 at the contract
  # pin and verifies the checked-out commit, then run the SystemC smoke inside
  # it: the C ABI static library, `atomic_tohost_exit` and `fd_fma` through the
  # pinned kernel and the blocking RAM target with the same exit code and a
  # byte-identical commit log as the native run, and the early-`sc_stop`
  # control that must not pass. The cache scope is separate so this job never
  # races the debug-attach job's export; it still reads that job's cached
  # layers for the unchanged part of the image.
  systemc-smoke:
    name: SystemC transport smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check the SystemC smoke script
        run: bash -n scripts/test_systemc_smoke.sh

      - name: Set up Docker Buildx
        # v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Detect runner account IDs
        id: runner-account
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build image
        # v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ruscv-sim-dev:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            DEV_UID=${{ steps.runner-account.outputs.uid }}
            DEV_GID=${{ steps.runner-account.outputs.gid }}
          cache-from: type=gha,scope=dev-container
          cache-to: type=gha,mode=max,scope=dev-container-systemc

      - name: Run the SystemC smoke
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            --env CARGO_BUILD_JOBS \
            --env CARGO_TERM_COLOR \
            --env CARGO_TARGET_DIR \
            ruscv-sim-dev:ci \
            bash -ceu './scripts/test_systemc_smoke.sh'

  # Coverage recompiles the workspace with instrumentation and is intentionally
  # manual. Run this workflow from the Actions UI when a coverage refresh is
  # useful instead of spending runner minutes on every push.
  coverage:
    name: Coverage
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust
        # stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      # test_add_direct assembles a bare-metal ELF during Rust tests.
      - name: Install RISC-V GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: >
          cargo llvm-cov --all-features --workspace
          --lcov --output-path lcov.info

      - name: Upload to Codecov
        # v5.5.5
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: true

permissions:
  contents: read
