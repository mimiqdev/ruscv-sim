# RISC-V ISS Simulator CI Workflow
# ===================================
# Simplified for single self-hosted runner
# No caching needed - runner is local

name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================
  # Job 1: Code Checks
  # ==========================================
  check:
    name: Check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --all-features --no-deps

  # ==========================================
  # Job 2: Test Suite
  # ==========================================
  test:
    name: Test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build project
        run: cargo build --all-features

      - name: Run unit tests
        run: cargo test --all-features --lib --bins

      - name: Run doc tests
        run: cargo test --all-features --doc

      - name: Run integration tests
        run: cargo test --all-features --test '*'
        continue-on-error: true

  # ==========================================
  # Job 3: Performance Benchmarks
  # ==========================================
  bench:
    name: Bench
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run benchmarks
        run: |
          cargo bench --all-features -- --test-threads=1

  # ==========================================
  # Job 4: Release Build
  # ==========================================
  build:
    name: Build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release
        run: cargo build --release --all-features

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruscv-sim-release
          path: target/release/ruscv-sim
          retention-days: 7

  # ==========================================
  # Job 5: Smoke Test
  # ==========================================
  smoke-test:
    name: Smoke Test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ruscv-sim-release
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/ruscv-sim

      - name: Run smoke test
        run: |
          echo "Running ruscv-sim..."
          ./target/release/ruscv-sim --version || true
          echo "✅ Smoke test passed!"

  # ==========================================
  # Job 6: Summary Report
  # ==========================================
  summary:
    name: Summary
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    needs: [check, test, build, smoke-test]

    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "## CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Check Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check.result }}" == "success" ]; then
            echo "✅ Check Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Check Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Test Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ Tests Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Smoke Test Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.smoke-test.result }}" == "success" ]; then
            echo "✅ Smoke Test Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Smoke Test Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Workflow completed at: $(date -u)" >> $GITHUB_STEP_SUMMARY

# ==========================================
# Permissions
# ==========================================
permissions:
  contents: read
  actions: read
  checks: write
  id-token: write
  attestations: write
  packages: write
