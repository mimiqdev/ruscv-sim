# RISC-V ISS Simulator CI Workflow
# ===================================
# Simplified for single self-hosted runner
# No caching needed - runner is local

name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [master, main]

# 避免单个 runner 被长时间占用
# 取消同一 PR/分支的旧运行，让新提交优先
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================
  # Job 1: Code Checks
  # ==========================================
  check:
    name: Check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --all-features --no-deps

  # ==========================================
  # Job 2: Test Suite
  # ==========================================
  test:
    name: Test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build project
        run: cargo build --all-features

      - name: Run unit tests
        run: cargo test --all-features --lib --bins

      - name: Run doc tests
        run: cargo test --all-features --doc

      - name: Run integration tests
        run: cargo test --all-features --test '*'
        continue-on-error: true

  # ==========================================
  # Job 3: Performance Benchmarks
  # ==========================================
  # Only run on push to main/master, not during PRs
  # Non-blocking baseline data collection
  bench:
    name: Bench
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    needs: test
    continue-on-error: true
    # Only run when pushing to main/master, skip for PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run benchmarks
        run: cargo bench --all-features
        continue-on-error: true

  # ==========================================
  # Job 4: Release Build
  # ==========================================
  build:
    name: Build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release
        run: cargo build --release --all-features

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruscv-sim-release
          path: target/release/ruscv-sim
          retention-days: 7

  # ==========================================
  # Job 5: RISC-V ELF Tests
  # ==========================================
  riscv-tests:
    name: RISC-V ELF Tests
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ruscv-sim-release
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/ruscv-sim

      - name: Install RISC-V toolchain
        run: |
          if ! command -v riscv64-unknown-elf-gcc &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y gcc-riscv64-unknown-elf
          fi
          riscv64-unknown-elf-gcc --version

      - name: Compile RISC-V test programs
        run: |
          chmod +x scripts/compile_riscv_tests.sh
          ./scripts/compile_riscv_tests.sh

      - name: Run RISC-V ELF tests
        run: |
          chmod +x scripts/run_elf_tests.sh
          ./scripts/run_elf_tests.sh

  # ==========================================
  # Job 6: Smoke Test
  # ==========================================
  smoke-test:
    name: Smoke Test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ruscv-sim-release
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/ruscv-sim

      - name: Run smoke test
        run: |
          echo "Running ruscv-sim..."
          ./target/release/ruscv-sim --version || true
          echo "✅ Smoke test passed!"

  # ==========================================
  # Job 7: Summary Report
  # ==========================================
  summary:
    name: Summary
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    needs: [check, test, bench, build, riscv-tests, smoke-test]

    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "## CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Check Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check.result }}" == "success" ]; then
            echo "✅ Check Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Check Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Test Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ Tests Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Benchmark Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.bench.result }}" == "success" ]; then
            echo "✅ Benchmarks Passed (baseline data)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.bench.result }}" == "failure" ]; then
            echo "⚠️  Benchmarks Failed (non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️  Benchmarks Skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### RISC-V ELF Tests Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.riscv-tests.result }}" == "success" ]; then
            echo "✅ RISC-V ELF Tests Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.riscv-tests.result }}" == "skipped" ]; then
            echo "⏭️  RISC-V ELF Tests Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ RISC-V ELF Tests Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Smoke Test Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.smoke-test.result }}" == "success" ]; then
            echo "✅ Smoke Test Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Smoke Test Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Note: Benchmarks are non-blocking and for baseline data collection only_" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workflow completed at: $(date -u)" >> $GITHUB_STEP_SUMMARY

# ==========================================
# Permissions
# ==========================================
permissions:
  contents: read
  actions: read
  checks: write
  id-token: write
  attestations: write
  packages: write
