# RISC-V ISS Simulator CI
# ========================
# Pull requests run one consolidated Rust quality job. More expensive release,
# bare-metal ELF, and coverage work runs only when it provides additional value.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    # Quality and tests is a required check, including for docs-only PRs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust
        # stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      # test_add_direct assembles a bare-metal ELF during Rust tests.
      - name: Install RISC-V GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Check documentation
        run: cargo doc --all-features --no-deps

      # Pull requests already exercise the debug/test build above. Build and run
      # the release binary only after code reaches main.
      - name: Build release binary
        if: github.event_name == 'push'
        run: cargo build --release --all-features

      - name: Smoke test release binary
        if: github.event_name == 'push'
        run: ./target/release/ruscv-sim --version

      - name: Compile RISC-V test programs
        if: github.event_name == 'push'
        run: ./scripts/compile_riscv_tests.sh

      - name: Run RISC-V ELF tests
        if: github.event_name == 'push'
        run: ./scripts/run_elf_tests.sh

  # Coverage recompiles the workspace with instrumentation and is intentionally
  # manual. Run this workflow from the Actions UI when a coverage refresh is
  # useful instead of spending runner minutes on every push.
  coverage:
    name: Coverage
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust
        # stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      # test_add_direct assembles a bare-metal ELF during Rust tests.
      - name: Install RISC-V GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: >
          cargo llvm-cov --all-features --workspace
          --lcov --output-path lcov.info

      - name: Upload to Codecov
        # v5.5.5
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: true

permissions:
  contents: read
