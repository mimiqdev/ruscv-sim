# RISC-V ISS Simulator CI Workflow
# ===================================

name: CI

on:
  push:
    branches: [master, main]
    tags:
      - v*
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ==========================================
  # Job 1: Code Checks (format, clippy, etc.)
  # ==========================================
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Check for unused dependencies
        run: cargo +nightly udeps --all-targets

      - name: Check documentation
        run: cargo doc --all-features --no-deps

  # ==========================================
  # Job 2: Test Suite (compile + test + coverage)
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install cargo-tarpaulin for coverage
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action-cargo-tarpaulin@v2

      - name: Build project
        run: cargo build --all-features

      - name: Run unit tests
        run: cargo test --lib --all-features

      - name: Run integration tests
        run: cargo test --tests --all-features

      - name: Run doc tests
        run: cargo test --doc --all-features

      - name: Run proptest tests
        run: cargo test --all-features --test-threads=4

      - name: Generate coverage report
        run: |
          cargo tarpaulin --all-features \
            --out Lcov \
            --target-dir target/tarpaulin \
            --verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./target/tarpaulin/lcov.info
          flags: unittests,integrationtests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/tarpaulin/
          retention-days: 7

  # ==========================================
  # Job 3: Performance Benchmarks
  # ==========================================
  bench:
    name: Bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks
        run: |
          cargo bench --all-features -- --output-style=json > benchmark_results.json

      - name: Parse and display benchmark results
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          cat benchmark_results.json | head -100 >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 30

  # ==========================================
  # Job 4: Release Build
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-

      - name: Build release
        run: |
          cargo build --release --all-features --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruscv-sim-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ruscv-sim
            target/${{ matrix.target }}/release/ruscv-sim.d
          retention-days: 7

      - name: Upload debug info
        uses: actions/upload-artifact@v4
        with:
          name: ruscv-sim-${{ matrix.target }}-debug
          path: target/${{ matrix.target }}/debug/
          retention-days: 7

  # ==========================================
  # Job 5: Smoke Test
  # ==========================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-

      - name: Build binary
        run: cargo build --release

      - name: Verify binary exists
        run: |
          test -f target/release/ruscv-sim && echo "✅ Binary found" || exit 1

      - name: Run version check
        run: |
          ./target/release/ruscv-sim --version || echo "Version check completed"

      - name: Run help command
        run: |
          ./target/release/ruscv-sim --help || echo "Help check completed"

      - name: Quick functionality test
        run: |
          # Quick test - verify binary runs and responds
          timeout 5s ./target/release/ruscv-sim || true
          echo "✅ Smoke test passed"

      - name: Download and test artifact
        uses: actions/download-artifact@v4
        with:
          name: ruscv-sim-x86_64-unknown-linux-gnu
          path: smoke-test/
        if: runner.os == 'Linux'

      - name: Verify downloaded artifact
        run: |
          ls -la smoke-test/
          file smoke-test/ruscv-sim
          test -x smoke-test/ruscv-sim && echo "✅ Artifact is executable" || exit 1

  # ==========================================
  # Summary Report
  # ==========================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, test, bench, build, smoke-test]
    if: always()

    steps:
      - name: CI Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          
          CHECK_STATUS="${{ needs.check.result }}"
          TEST_STATUS="${{ needs.test.result }}"
          BENCH_STATUS="${{ needs.bench.result }}"
          BUILD_STATUS="${{ needs.build.result }}"
          SMOKE_STATUS="${{ needs.smoke-test.result }}"
          
          echo "| Check | $CHECK_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | $TEST_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Bench | $BENCH_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $BUILD_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | $SMOKE_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          FAILED=0
          if [ "$CHECK_STATUS" = "failure" ]; then FAILED=1; fi
          if [ "$TEST_STATUS" = "failure" ]; then FAILED=1; fi
          if [ "$BUILD_STATUS" = "failure" ]; then FAILED=1; fi
          if [ "$SMOKE_STATUS" = "failure" ]; then FAILED=1; fi
          
          if [ $FAILED -eq 1 ]; then
            echo "❌ CI Pipeline FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ CI Pipeline PASSED" >> $GITHUB_STEP_SUMMARY
          fi
