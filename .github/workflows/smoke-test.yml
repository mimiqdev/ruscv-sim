# Smoke Test Workflow - 验证 CI/CD 基础流程
# 用于测试 GitHub Actions 是否正常工作

name: 🚬 Smoke Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # 手动触发
  workflow_dispatch:

jobs:
  # 1. 检查 GitHub Actions 权限
  check-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Check permissions
        run: |
          echo "✅ GitHub Actions 正常运行"
          echo "✅ 当前用户: ${{ github.actor }}"
          echo "✅ 仓库: ${{ github.repository }}"
          echo "✅ 分支: ${{ github.ref }}"
          echo "✅ 事件: ${{ github.event_name }}"
          
  # 2. 检查 checkout 是否正常
  checkout-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Verify checkout
        run: |
          echo "✅ Checkout 成功"
          ls -la
          
  # 3. 验证 Rust 安装
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          
      - name: Verify Rust
        run: |
          echo "✅ Rust 版本: $(rustc --version)"
          echo "✅ Cargo 版本: $(cargo --version)"
          
      - name: Cargo check
        run: |
          cd ${{ github.workspace }}
          # 只是检查编译，不实际编译项目
          echo "📦 检查项目配置..."
          ls -la Cargo.toml 2>/dev/null || echo "⚠️  无 Cargo.toml"
          
  # 4. 验证 Docker（如果可用）
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker
        run: |
          if command -v docker &> /dev/null; then
            echo "✅ Docker 可用: $(docker --version)"
            docker info --format '{{.ServerVersion}}' 2>/dev/null || echo "Docker daemon 未运行"
          else
            echo "⚠️ Docker 未安装"
          fi
          
  # 5. 验证 GitHub Actions 工具
  tools-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check tools
        run: |
          echo "✅ Git 版本: $(git --version)"
          echo "✅ Bash 版本: $(bash --version | head -1)"
          
  # 6. 模拟简单任务
  simulate-work:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate work
        run: |
          echo "🚀 开始模拟工作..."
          sleep 2
          echo "✅ 工作完成"
          
          # 创建测试文件
          echo "test output" > /tmp/smoke-test.txt
          cat /tmp/smoke-test.txt
          
  # 7. 上传测试 artifact
  artifact-test:
    runs-on: ubuntu-latest
    steps:
      - name: Create artifact
        run: |
          echo "smoke-test-$(date +%s)" > artifact.txt
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-artifact
          path: artifact.txt
          retention-days: 1
          
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: smoke-test-artifact
          path: downloaded/
          
      - name: Verify artifact
        run: |
          echo "✅ Artifact 上传/下载成功"
          cat downloaded/artifact.txt
