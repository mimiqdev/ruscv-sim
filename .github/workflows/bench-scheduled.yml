# RISC-V ISS Simulator - Scheduled Benchmark Workflow
# ====================================================
# Runs daily to collect baseline performance data
# Helps track performance regressions over time

name: Daily Benchmarks

on:
  schedule:
    # Run daily at 02:00 UTC (10:00 CST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================
  # Daily Benchmark Collection
  # ==========================================
  benchmark:
    name: Daily Benchmark
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run comprehensive benchmarks
        run: |
          echo "## Benchmark Results - $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo bench --all-features -- --verbose
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Daily benchmarks completed" >> $GITHUB_STEP_SUMMARY

      - name: Archive benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: target/criterion/
          retention-days: 30

  # ==========================================
  # Summary Report
  # ==========================================
  summary:
    name: Summary
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    needs: benchmark
    if: always()

    steps:
      - name: Benchmark Summary
        run: |
          echo "## Daily Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.benchmark.result }}" == "success" ]; then
            echo "✅ Daily benchmarks completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Daily benchmarks failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Next scheduled run: Daily at 02:00 UTC" >> $GITHUB_STEP_SUMMARY
          echo "Completed at: $(date -u)" >> $GITHUB_STEP_SUMMARY

# ==========================================
# Permissions
# ==========================================
permissions:
  contents: read
  actions: read
  id-token: write
