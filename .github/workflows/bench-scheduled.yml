# RISC-V ISS Simulator - Scheduled Benchmark Workflow
# ====================================================
# Runs weekly to collect baseline performance data
# Helps track performance regressions over time

name: Daily Benchmarks

on:
  schedule:
    # Run every Sunday at 02:00 UTC (10:00 China Standard Time)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================
  # Daily Benchmark Collection
  # ==========================================
  benchmark:
    name: Daily Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run comprehensive benchmarks
        run: |
          cargo bench --all-features -- --verbose
          {
            echo "## Benchmark Results - $(date -u)"
            echo ""
            echo "✅ Weekly benchmarks completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: target/criterion/
          retention-days: 7

# ==========================================
# Permissions
# ==========================================
permissions:
  contents: read
