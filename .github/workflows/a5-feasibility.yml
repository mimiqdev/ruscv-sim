name: A5 ACT4 selected compatibility
on:
  workflow_dispatch:
    inputs:
      selection:
        description: "Frozen selection: proposal (51-case RV64I), zca (32-source rv64i/Zca), fd (82-source rv64i/F + 114-source rv64i/D) or zcd (4-source rv64i/Zcd)"
        required: false
        default: proposal
        type: choice
        options:
          - proposal
          - zca
          - fd
          - zcd
permissions:
  contents: read
concurrency:
  group: a5-feasibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-22.04
    # The 30-minute bound of the recorded RV64I and Zca controls is unchanged.
    # The FP selections generate, compile and simulate 196 and 4 sources, so
    # they get their own bound instead of loosening the controls.
    timeout-minutes: ${{ (inputs.selection == 'fd' || inputs.selection == 'zcd') && 150 || 30 }}
    env:
      A5_SELECTION: ${{ inputs.selection || 'proposal' }}
      UV_CACHE_DIR: ${{ github.workspace }}/.a5/cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.a5/tools/python
      BUNDLE_USER_HOME: ${{ github.workspace }}/.a5/cache/bundle
      BUNDLE_PATH: ${{ github.workspace }}/.a5/tools/gems
      CARGO_HOME: ${{ github.workspace }}/.a5/cache/cargo
      XDG_DATA_HOME: ${{ github.workspace }}/.a5/cache/data
      XDG_CACHE_HOME: ${{ github.workspace }}/.a5/cache/xdg
      XDG_CONFIG_HOME: ${{ github.workspace }}/.a5/cache/config
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4.9'
          bundler: '4.0.8'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Generate and verify the frozen A5 selection
        shell: bash
        run: |
          mkdir -p .a5/evidence
          set -o pipefail
          bash scripts/a5/experiment.sh 2>&1 | tee .a5/evidence/experiment.log
      - name: Retain bounded experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a5-${{ inputs.selection || 'proposal' }}-${{ github.sha }}
          path: |
            .a5/evidence
            .a5/work
            .a5/config
          retention-days: 14
          if-no-files-found: warn
